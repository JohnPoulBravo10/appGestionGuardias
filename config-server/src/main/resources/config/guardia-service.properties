spring.application.name=guardia-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/guardia_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Kafka Producer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=${SPRING_KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
spring.kafka.producer.value-serializer=${SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER:org.springframework.kafka.support.serializer.JsonSerializer}

# Kafka Consumer (eventos de empleado-service y solicitudes-service)
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:guardia-service-empleado-group}
spring.kafka.consumer.key-deserializer=${SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
spring.kafka.consumer.value-deserializer=${SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER:org.springframework.kafka.support.serializer.JsonDeserializer}
spring.kafka.consumer.properties.spring.json.trusted.packages=${SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES:com.sistema.guardias.*,com.jpbravo.*}
spring.kafka.consumer.properties.spring.json.use.type.headers=${SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS:false}

# Consumir desde el principio si no hay offset
spring.kafka.consumer.auto-offset-reset=earliest

# Configuración de Resilience4j para Schedulers y Procesos asíncronos
resilience4j.timelimiter.instances.schedulerLimiter.timeout-duration=15s

resilience4j.retry.instances.schedulerRetry.max-attempts=3
resilience4j.retry.instances.schedulerRetry.wait-duration=2s

# Circuit Breaker para Kafka
resilience4j.circuitbreaker.instances.kafkaCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.kafkaCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaCB.wait-duration-in-open-state=20s

# Retry para Kafka
resilience4j.retry.instances.kafkaRetry.max-attempts=3
resilience4j.retry.instances.kafkaRetry.wait-duration=2s

# Circuit Breaker para Consumidores Kafka
resilience4j.circuitbreaker.instances.consumerCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.consumerCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.consumerCB.wait-duration-in-open-state=20s

# Retry para Consumidores Kafka
resilience4j.retry.instances.consumerRetry.max-attempts=3
resilience4j.retry.instances.consumerRetry.wait-duration=2s

# Observabilidad: Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
