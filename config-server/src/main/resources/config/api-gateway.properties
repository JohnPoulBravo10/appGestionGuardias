spring.application.name=api-gateway

server.port=8090

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Empleado Service
spring.cloud.gateway.server.webflux.routes[0].id=empleado-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://EMPLEADO-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/empleados/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=CircuitBreaker=empleadoServiceCB,forward:/fallback/empleados
spring.cloud.gateway.server.webflux.routes[0].filters[1]=Resilience4jRateLimiter=apiLimiter

# Guardia Service
spring.cloud.gateway.server.webflux.routes[1].id=guardia-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://GUARDIA-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/guardias/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=CircuitBreaker=guardiaServiceCB,forward:/fallback/guardias
spring.cloud.gateway.server.webflux.routes[1].filters[1]=Resilience4jRateLimiter=apiLimiter

# Autenticacion Service
spring.cloud.gateway.server.webflux.routes[2].id=autenticacion-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AUTENTICACION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=CircuitBreaker=authServiceCB,forward:/fallback/auth
spring.cloud.gateway.server.webflux.routes[2].filters[1]=Resilience4jRateLimiter=authLimiter

# Notification Service
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notificaciones/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=CircuitBreaker=notificationServiceCB,forward:/fallback/notificaciones
spring.cloud.gateway.server.webflux.routes[3].filters[1]=Resilience4jRateLimiter=apiLimiter

# Solicitudes Service
spring.cloud.gateway.server.webflux.routes[4].id=solicitudes-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://SOLICITUDES-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/solicitudes/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=CircuitBreaker=solicitudesServiceCB,forward:/fallback/solicitudes
spring.cloud.gateway.server.webflux.routes[4].filters[1]=Resilience4jRateLimiter=apiLimiter

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# JWT Configuration (mismo secret que autenticacion-service para verificar firma)
jwt.secret=${JWT_SECRET}

# Rutas que no requieren autenticación JWT
jwt.public-paths=/auth/**

# Configuración global de Resilience4j Circuit Breaker
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5

# Configuración global de TimeLimiter
resilience4j.timelimiter.configs.default.timeout-duration=3s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# Configuración global de RateLimiter Resilience4j
resilience4j.ratelimiter.configs.default.limit-refresh-period=1s
resilience4j.ratelimiter.configs.default.timeout-duration=0s

# Instancia estricta para Auth (5 por minuto)
resilience4j.ratelimiter.instances.authLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.authLimiter.limit-refresh-period=60s
resilience4j.ratelimiter.instances.authLimiter.base-config=default

# Instancia para endpoints API autenticados (20 por segundo)
resilience4j.ratelimiter.instances.apiLimiter.limit-for-period=20
resilience4j.ratelimiter.instances.apiLimiter.base-config=default

# Observabilidad: Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}