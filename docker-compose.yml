version: '3.8'

services:

  # ==================== BASE DE DATOS ====================
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - guardias-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== MONGO DB (SOLICITUDES) ====================
  mongo-solicitudes:
    image: mongo:6.0
    container_name: mongo-solicitudes
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-solicitudes-data:/data/db
    networks:
      - guardias-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== CONFIG SERVER ====================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: docker, native
    networks:
      - guardias-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== DISCOVERY SERVER (EUREKA) ====================
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: docker, native
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - guardias-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== EMPLEADO SERVICE ====================
  empleado-service:
    build:
      context: ./MICROSERVICIOS/empleado-service
      dockerfile: Dockerfile
    container_name: empleado-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: docker, native
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/empleado_service?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    networks:
      - guardias-network

  # ==================== GUARDIA SERVICE ====================
  guardia-service:
    build:
      context: ./MICROSERVICIOS/guardia-service
      dockerfile: Dockerfile
    container_name: guardia-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: docker, native
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/guardia_service?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
    depends_on:
      discovery-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - guardias-network

  # ==================== AUTENTICACION SERVICE ====================
  autenticacion-service:
    build:
      context: ./MICROSERVICIOS/autenticacion-service
      dockerfile: Dockerfile
    container_name: autenticacion-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: docker, native
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/autenticacion_service?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    networks:
      - guardias-network

  # ==================== MONGODB NOTIFICACIONES ====================
  mongo-db:
    image: mongo:7
    container_name: mongo-db
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - guardias-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==================== KAFKA ====================
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - guardias-network

  # ==================== NOTIFICATION SERVICE ====================
  notification-service:
    build:
      context: ./MICROSERVICIOS/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: docker,native
      SERVER_PORT: 8084
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATA_MONGODB_URI: mongodb://mongo-db:27017/notification_service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: notification-service-group
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: false
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: com.jpbravo.notification_service.event.GuardiaEvent
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - guardias-network

  # ==================== SOLICITUDES SERVICE ====================
  solicitudes-service:
    build:
     context: ./MICROSERVICIOS/solicitudes-service
     dockerfile: Dockerfile
    container_name: solicitudes-service
    restart: unless-stopped
    ports:
    - "8085:8085"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: docker,native
      SERVER_PORT: 8085
      SPRING_DATA_MONGODB_URI: mongodb://mongo-solicitudes:27017/solicitudes_service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      mongo-solicitudes:
        condition: service_healthy
    networks:
     - guardias-network


  # ==================== API GATEWAY ====================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: docker, native
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - guardias-network
   

  # ==================== FRONTEND (SPA UNIFICADA) ====================
  frontend:
    build:
      context: ./FRONT/guardias-front
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - guardias-network

  # ==================== PHPMYADMIN ====================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      TZ: America/Argentina/Buenos_Aires
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - guardias-network

volumes:
  mysql-data:
  mongo-data:
  mongo-solicitudes-data:

networks:
  guardias-network:
    driver: bridge
