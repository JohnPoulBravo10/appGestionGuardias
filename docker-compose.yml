services:

  # ==================== BASE DE DATOS MySQL ====================
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - guardias-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ==================== MONGO DB (SOLICITUDES) ====================
  mongo-solicitudes:
    image: mongo:6.0
    container_name: mongo-solicitudes
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-solicitudes-data:/data/db
    networks:
      - guardias-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u ${MONGO_USER} -p ${MONGO_PASSWORD} localhost:27017/test --quiet --authenticationDatabase admin
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ==================== MONGO DB (NOTIFICACIONES) ====================
  mongo-notificaciones:
    image: mongo:6.0
    container_name: mongo-notificaciones
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-notificaciones-data:/data/db
    networks:
      - guardias-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u ${MONGO_USER} -p ${MONGO_PASSWORD} localhost:27017/test --quiet --authenticationDatabase admin
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ==================== KAFKA ====================
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - guardias-network

  # ==================== CONFIG SERVER ====================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: native
    networks:
      - guardias-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

  # ==================== DISCOVERY SERVER (EUREKA) ====================
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: native
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_INSTANCE_HOSTNAME: discovery-server
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - guardias-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 500s

  # ==================== EMPLEADO SERVICE ====================
  empleado-service:
    build:
      context: ./MICROSERVICIOS/empleado-service
      dockerfile: Dockerfile
    container_name: empleado-service
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: native
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/empleado_service?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Kafka Producer (eventos de empleado hacia otros servicios)
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      # Kafka Consumer (eventos de autenticacion-service: registro de usuarios)
      SPRING_KAFKA_CONSUMER_GROUP_ID: empleado-service-usuario-group
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "com.sistema.guardias.*,com.jpbravo.*"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: false
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - guardias-network

  # ==================== GUARDIA SERVICE ====================
  guardia-service:
    build:
      context: ./MICROSERVICIOS/guardia-service
      dockerfile: Dockerfile
    container_name: guardia-service
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: native
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/guardia_service?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_CONSUMER_GROUP_ID: guardia-service-empleado-group
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "com.sistema.guardias.*,com.jpbravo.*"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: false
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - guardias-network

  # ==================== AUTENTICACION SERVICE ====================
  autenticacion-service:
    build:
      context: ./MICROSERVICIOS/autenticacion-service
      dockerfile: Dockerfile
    container_name: autenticacion-service
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: native
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/autenticacion_service?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Kafka Producer (evento de registro de usuario)
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      # Kafka Consumer (eventos de empleado-service)
      SPRING_KAFKA_CONSUMER_GROUP_ID: autenticacion-service-empleado-group
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "com.sistema.guardias.*,com.jpbravo.*"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: false
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: com.sistema.guardias.autenticacion_service.event.EmpleadoEvent
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - guardias-network

  # ==================== NOTIFICATION SERVICE ====================
  notification-service:
    build:
      context: ./MICROSERVICIOS/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: native
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SERVER_PORT: 8084
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-notificaciones:27017/notification_service?authSource=admin
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: notification-service-group
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "com.sistema.guardias.*,com.jpbravo.*"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: false
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: com.jpbravo.notification_service.event.GuardiaEvent
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mongo-notificaciones:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - guardias-network

  # ==================== SOLICITUDES SERVICE ====================
  solicitudes-service:
    build:
      context: ./MICROSERVICIOS/solicitudes-service
      dockerfile: Dockerfile
    container_name: solicitudes-service
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: native
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SERVER_PORT: 8085
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-solicitudes:27017/solicitudes_service?authSource=admin
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_CONSUMER_GROUP_ID: solicitudes-service-empleado-group
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "com.sistema.guardias.*,com.jpbravo.*"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: false
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: com.jpbravo.solicitudes_service.event.EmpleadoEvent
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mongo-solicitudes:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - guardias-network

  # ==================== API GATEWAY ====================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: native
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - guardias-network

  # ==================== FRONTEND (SPA UNIFICADA) ====================
  frontend:
    build:
      context: ./FRONT/guardias-front
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - guardias-network

  # ==================== PHPMYADMIN ====================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - guardias-network

volumes:
  mysql-data:
  mongo-solicitudes-data:
  mongo-notificaciones-data:

networks:
  guardias-network:
    driver: bridge
